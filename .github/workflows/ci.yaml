name: continuous-integration
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "overrides/**"
      - "**.md"
      - zensical.toml
      - .github/workflows/docs.yaml
  pull_request:
    paths-ignore:
      - "docs/**"
      - "overrides/**"
      - "**.md"
      - zensical.toml
      - .github/workflows/docs.yaml
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: install dbc
        run: curl -LsSf https://dbc.columnar.tech/install.sh | sh

      - name: install duckdb driver
        run: dbc install duckdb

      - name: build
        run: cargo build

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  # Compile the Windows-only code (console Ctrl-C handling, running the pager
  # through cmd) and run the unit tests. The integration tests need bash and
  # an ADBC driver, so they only run on Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: build
        run: cargo build

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --bins
